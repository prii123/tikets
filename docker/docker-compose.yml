services:
  postgres:
    image: postgres:16-alpine
    container_name: tickets_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tickets}
      # Usado por 08_set_passwords.sh para fijar la contraseña del rol
      # "authenticator" creado en 04_roles.sql.
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
    volumes:
      - tickets_pgdata:/var/lib/postgresql/data
      # Se montan uno a uno (en vez de la carpeta completa) para poder
      # intercalar 08_set_passwords.sh al final manteniendo el orden 01-08.
      - ../database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/02_indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ../database/03_functions_triggers.sql:/docker-entrypoint-initdb.d/03_functions_triggers.sql:ro
      - ../database/04_roles.sql:/docker-entrypoint-initdb.d/04_roles.sql:ro
      - ../database/05_grants.sql:/docker-entrypoint-initdb.d/05_grants.sql:ro
      - ../database/06_rls_policies.sql:/docker-entrypoint-initdb.d/06_rls_policies.sql:ro
      - ../database/07_seed.sql:/docker-entrypoint-initdb.d/07_seed.sql:ro
      - ./initdb/08_set_passwords.sh:/docker-entrypoint-initdb.d/08_set_passwords.sh:ro
      # Datos de PRUEBA (empresas/usuarios/tickets ficticios). Quita esta
      # línea antes de un despliegue real con datos de producción.
      - ../database/09_seed_demo.sql:/docker-entrypoint-initdb.d/09_seed_demo.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - tickets_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tickets}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    # Fijado a v14.13: PostgREST v16 cambió el parser de jwt-role-claim-key
    # y rompe la sintaxis .\"key\"[0] para claims con caracteres especiales
    # (ej. "cognito:groups"). Confirmado reproduciendo el crash en local.
    image: postgrest/postgrest:v14.13
    container_name: tickets_postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${POSTGREST_PORT:-3000}:3000"
    volumes:
      # Llave pública de Cognito (un solo JWK plano, no el JWKS completo
      # envuelto en {"keys":[...]}) — ver el comentario de PGRST_JWT_SECRET
      # más abajo sobre por qué.
      - ./postgrest-jwt-secret.json:/etc/postgrest/jwt-secret.json:ro
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-tickets}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: web_anon
      # Llave pública de Cognito para validar el JWT (RS256), leída de
      # archivo con @ruta (ver docs de PostgREST: "jwt-secret"). Probamos
      # primero con la URL del JWKS y luego con el JWKS completo como JSON
      # fijo, y ambas fallaban con "No suitable key or wrong key type"
      # (PGRST301) en v14.13 aunque el kid sí existía ahí. La docs de
      # PostgREST muestran el jwt-secret como un JWK SUELTO (un solo
      # objeto), no como un JWKS con "keys":[...] — con dos llaves en el
      # array algo en el matching del kid se rompía. Aquí se usa solo la
      # llave que de verdad firma tus tokens (confirmada decodificando un
      # access token real). Si Cognito rota sus llaves de firma, regenera
      # docker/postgrest-jwt-secret.json con la llave nueva:
      #   curl https://cognito-idp.<region>.amazonaws.com/<pool-id>/.well-known/jwks.json
      PGRST_JWT_SECRET: "@/etc/postgrest/jwt-secret.json"
      PGRST_JWT_SECRET_IS_BASE64: "false"
      # Cognito mete el rol en "cognito:groups" (array), no en "role".
      # Este JSONPath toma el primer grupo del usuario como rol de Postgres.
      # Las comillas van literales (comillas simples de YAML por fuera),
      # NO escapadas con backslash: eso solo aplica dentro de postgrest.conf.
      PGRST_JWT_ROLE_CLAIM_KEY: '."cognito:groups"[0]'
      # Descomenta si validas el ID Token (trae "aud" = App Client ID).
      # Los Access Token de Cognito no traen "aud".
      # PGRST_JWT_AUD: ${COGNITO_APP_CLIENT_ID}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_SERVER_PORT: 3000
    networks:
      - tickets_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # Vite incrusta estas variables en el bundle en tiempo de build.
      # Si cambias la IP del backend o el Cognito, hay que reconstruir:
      # docker compose build frontend && docker compose up -d frontend
      args:
        VITE_POSTGREST_URL: ${VITE_POSTGREST_URL}
        VITE_COGNITO_REGION: ${VITE_COGNITO_REGION}
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID}
        VITE_CREAR_USUARIO_URL: ${VITE_CREAR_USUARIO_URL}
    container_name: tickets_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - tickets_net

volumes:
  tickets_pgdata:

networks:
  tickets_net:
    driver: bridge
